apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-app-ing
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: todo-app-svc
            port:
              number: 1234 # This need to match the port defined in the service manifest
