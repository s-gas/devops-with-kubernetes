apiVersion: apps/v1
kind: Deployment
metadata:
  name: rand-hex-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rand-hex
  template:
    metadata:
      labels:
        app: rand-hex
    spec:
      volumes:
        - name: shared
          emptyDir: {}
      containers:
        - name: rand-hex-write
          image: sgasparini/rand-hex-write:1.0.0
          volumeMounts:
            - name: shared
              mountPath: /shared
        - name: rand-hex-read
          image: sgasparini/rand-hex-read:1.0.0
          volumeMounts:
            - name: shared
              mountPath: /shared
